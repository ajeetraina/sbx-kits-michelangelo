<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#2f6be0"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a3d7a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>

  <!-- HOST SYSTEM -->
  <rect x="30" y="30" width="1140" height="600" rx="28" fill="#eaf3fd" stroke="#9cc3f0" stroke-width="2"/>
  <text x="66" y="602" font-size="22" font-weight="700" fill="#1a56db">Host system — one machine (macOS + Docker Desktop)</text>

  <!-- sbx sandbox (left) -->
  <rect x="70" y="110" width="380" height="360" rx="22" fill="#f6faff" stroke="#c2d9f5" stroke-width="1.5"/>
  <text x="98" y="148" font-size="17" font-weight="600" fill="#16305c">sbx microVM sandbox</text>
  <text x="98" y="168" font-size="12" fill="#5a6b85">holds only the agent + client</text>

  <rect x="98" y="192" width="324" height="64" rx="12" fill="#ffffff" stroke="#d3e3f8" filter="url(#sh)"/>
  <text x="260" y="230" font-size="16" font-weight="600" fill="#16305c" text-anchor="middle">Agent / Claude</text>

  <rect x="98" y="280" width="324" height="82" rx="12" fill="#ffffff" stroke="#d3e3f8" filter="url(#sh)"/>
  <text x="260" y="312" font-size="15" font-weight="600" fill="#16305c" text-anchor="middle">michelangelo-client</text>
  <text x="260" y="334" font-size="12.5" fill="#2f6be0" text-anchor="middle">ma SDK / CLI (pip install michelangelo)</text>

  <!-- Docker Desktop (right) -->
  <rect x="520" y="90" width="600" height="440" rx="22" fill="#f6faff" stroke="#c2d9f5" stroke-width="1.5"/>
  <text x="548" y="128" font-size="17" font-weight="600" fill="#16305c">Docker Desktop</text>

  <!-- k3d Kubernetes cluster -->
  <rect x="548" y="152" width="544" height="352" rx="16" fill="#ffffff" stroke="#d3e3f8" filter="url(#sh)"/>
  <text x="572" y="184" font-size="15" font-weight="600" fill="#16305c">k3d Kubernetes cluster</text>

  <!-- Michelangelo platform -->
  <rect x="572" y="204" width="496" height="284" rx="14" fill="#eef4fc" stroke="#dce8f8"/>
  <text x="820" y="238" font-size="16" font-weight="700" fill="#16305c" text-anchor="middle">Michelangelo platform</text>

  <rect x="596" y="258" width="448" height="46" rx="8" fill="#ffffff" stroke="#dce8f8"/>
  <text x="616" y="286" font-size="13" fill="#16305c">apiserver :15566 (gRPC) · UI :8090</text>
  <rect x="596" y="316" width="448" height="46" rx="8" fill="#ffffff" stroke="#dce8f8"/>
  <text x="616" y="344" font-size="13" fill="#16305c">Cadence / Temporal · MinIO object store</text>
  <rect x="596" y="374" width="448" height="46" rx="8" fill="#ffffff" stroke="#dce8f8"/>
  <text x="616" y="402" font-size="13" fill="#16305c">KubeRay operator · Ray head + workers</text>
  <text x="596" y="456" font-size="11.5" fill="#5a6b85">the whole ML platform runs on Docker Desktop's Kubernetes</text>

  <!-- arrow: client -> apiserver -->
  <line x1="422" y1="322" x2="594" y2="282" stroke="#2f6be0" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="468" y="290" font-size="12" font-weight="600" fill="#2f6be0">gRPC :15566</text>
</svg>
