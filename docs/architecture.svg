<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 760" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#2f6be0"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a3d7a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1560" height="760" fill="#ffffff"/>

  <!-- HOST -->
  <rect x="40" y="40" width="1200" height="660" rx="28" fill="#eaf3fd" stroke="#9cc3f0" stroke-width="2"/>
  <text x="76" y="676" font-size="22" font-weight="700" fill="#1a56db">Host machine</text>

  <!-- Workspace -->
  <rect x="80" y="150" width="212" height="84" rx="14" fill="#ffffff" stroke="#d3e3f8" filter="url(#sh)"/>
  <text x="186" y="184" font-size="15" font-weight="600" fill="#16305c" text-anchor="middle">Workspace</text>
  <text x="186" y="206" font-size="12" fill="#5a6b85" text-anchor="middle">michelangelo repo (git clone)</text>

  <!-- microVM sandbox -->
  <rect x="340" y="110" width="560" height="500" rx="22" fill="#f6faff" stroke="#c2d9f5" stroke-width="1.5"/>
  <text x="372" y="146" font-size="18" font-weight="600" fill="#16305c">microVM-based sandbox</text>
  <text x="872" y="146" font-size="12" fill="#5a6b85" text-anchor="end">own kernel + private Docker daemon</text>

  <!-- dashed container -->
  <rect x="372" y="162" width="320" height="200" rx="16" fill="none" stroke="#9cc3f0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="680" y="182" font-size="12" fill="#5a6b85" text-anchor="end">container</text>
  <rect x="398" y="186" width="268" height="56" rx="12" fill="#ffffff" stroke="#d3e3f8" filter="url(#sh)"/>
  <text x="532" y="219" font-size="16" font-weight="600" fill="#16305c" text-anchor="middle">Agent / Claude</text>
  <rect x="398" y="264" width="268" height="76" rx="12" fill="#ffffff" stroke="#d3e3f8" filter="url(#sh)"/>
  <text x="532" y="294" font-size="15" font-weight="600" fill="#16305c" text-anchor="middle">Michelangelo kit</text>
  <text x="532" y="316" font-size="13" fill="#2f6be0" text-anchor="middle">Kind: mixin</text>

  <!-- shim pill -->
  <rect x="372" y="384" width="496" height="34" rx="10" fill="#eaf3fd" stroke="#bcd4f5"/>
  <text x="620" y="406" font-size="12.5" fill="#16305c" text-anchor="middle">k3d shim patches create · /dev/kmsg · flannel host-gw · API → 127.0.0.1</text>

  <!-- k3d cluster -->
  <rect x="372" y="434" width="496" height="152" rx="16" fill="#ffffff" stroke="#d3e3f8" filter="url(#sh)"/>
  <text x="392" y="460" font-size="15" font-weight="600" fill="#16305c">k3d cluster (k3s) · private Docker daemon</text>
  <rect x="392" y="470" width="456" height="42" rx="8" fill="#eef4fc" stroke="#dce8f8"/>
  <text x="408" y="496" font-size="12.5" fill="#16305c">server node — API :15566 · Dashboard :8090 · Cadence/Temporal · MinIO</text>
  <rect x="392" y="520" width="456" height="42" rx="8" fill="#eef4fc" stroke="#dce8f8"/>
  <text x="408" y="546" font-size="12.5" fill="#16305c">agent node — KubeRay operator · Ray head + workers</text>
  <text x="392" y="600" font-size="11.5" fill="#5a6b85">the sandbox IS the Linux + Docker host — Colima not needed</text>

  <!-- right: governed egress -->
  <rect x="940" y="170" width="152" height="72" rx="14" fill="#ffffff" stroke="#d3e3f8" filter="url(#sh)"/>
  <text x="1016" y="199" font-size="13" font-weight="600" fill="#16305c" text-anchor="middle">Toolchain</text>
  <text x="1016" y="219" font-size="11" fill="#5a6b85" text-anchor="middle">dl.k8s.io · PyPI</text>

  <rect x="1108" y="170" width="152" height="72" rx="14" fill="#ffffff" stroke="#d3e3f8" filter="url(#sh)"/>
  <text x="1184" y="199" font-size="13" font-weight="600" fill="#16305c" text-anchor="middle">Cluster images</text>
  <text x="1184" y="219" font-size="11" fill="#5a6b85" text-anchor="middle">Hub · GHCR · Quay</text>

  <rect x="980" y="300" width="240" height="82" rx="16" fill="#ffffff" stroke="#b8d4f5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1100" y="334" font-size="16" font-weight="600" fill="#16305c" text-anchor="middle">Network Policy</text>
  <text x="1100" y="357" font-size="12" fill="#5a6b85" text-anchor="middle">default-deny allowlist</text>

  <!-- External systems (outside host) -->
  <rect x="1320" y="282" width="200" height="112" rx="18" fill="#ffffff" stroke="#cfe0f6" filter="url(#sh)"/>
  <text x="1420" y="326" font-size="16" font-weight="600" fill="#16305c" text-anchor="middle">External Systems</text>
  <text x="1420" y="350" font-size="12" fill="#5a6b85" text-anchor="middle">registries · PyPI · GitHub</text>

  <!-- tagline -->
  <text x="1316" y="474" font-size="19" font-weight="700" fill="#1a56db">The whole platform runs</text>
  <text x="1316" y="500" font-size="19" font-weight="700" fill="#1a56db">inside the microVM</text>
  <text x="1316" y="528" font-size="13" fill="#5a6b85">Colima replaced · host untouched</text>
  <text x="1316" y="547" font-size="13" fill="#5a6b85">· credential-free</text>

  <!-- ARROWS -->
  <line x1="292" y1="192" x2="394" y2="210" stroke="#2f6be0" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="532" y1="242" x2="532" y2="262" stroke="#2f6be0" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="532" y1="340" x2="532" y2="432" stroke="#2f6be0" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1016" y1="242" x2="1050" y2="298" stroke="#2f6be0" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1184" y1="242" x2="1150" y2="298" stroke="#2f6be0" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1220" y1="340" x2="1316" y2="336" stroke="#2f6be0" stroke-width="2.5" stroke-dasharray="3 5" marker-end="url(#a)"/>
</svg>
