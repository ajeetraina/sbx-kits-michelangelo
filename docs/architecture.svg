<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#57606a"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#0b6bcb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
  <text x="24" y="20" font-size="12" fill="#57606a">sbx kit for Michelangelo — architecture</text>

  <!-- ===================== HOST BAND ===================== -->
  <rect x="24" y="30" width="1152" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="54" font-size="14" font-weight="700" fill="#1b1f24">Your machine (macOS / Linux) — host Docker / Colima never touched</text>
  <rect x="44" y="64" width="392" height="28" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="56" y="82" font-size="11.5" font-family="monospace" fill="#24292f">$ sbx run -m 8GB --kit …/sbx-kits-michelangelo claude</text>
  <rect x="742" y="64" width="196" height="28" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="754" y="82" font-size="11.5" font-family="monospace" fill="#24292f">localhost:8090  dashboard</text>
  <rect x="946" y="64" width="216" height="28" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="958" y="82" font-size="11.5" font-family="monospace" fill="#24292f">localhost:15566  gRPC API</text>

  <!-- ===================== HYPERVISOR BOUNDARY ===================== -->
  <line x1="24" y1="120" x2="1176" y2="120" stroke="#8250df" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="500" y="110" width="200" height="20" rx="10" fill="#f3effc" stroke="#8250df"/>
  <text x="600" y="124" font-size="11" fill="#5a32a3" text-anchor="middle">hypervisor boundary — kernel isolated</text>

  <!-- input flow: sbx run -> microVM -->
  <line x1="240" y1="92" x2="240" y2="138" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="248" y="112" font-size="10.5" fill="#57606a">layer kit</text>

  <!-- ===================== MICROVM ===================== -->
  <rect x="24" y="138" width="1152" height="484" rx="12" fill="#e9f2fc" stroke="#0b6bcb" stroke-width="2"/>
  <text x="44" y="164" font-size="15" font-weight="700" fill="#0b4a8f">Docker Sandbox microVM — its own Linux kernel + private Docker daemon (this replaces Colima)</text>

  <!-- LEFT: kit toolchain -->
  <rect x="44" y="180" width="320" height="424" rx="10" fill="#ffffff" stroke="#b9c6d3"/>
  <text x="60" y="204" font-size="13" font-weight="700" fill="#1b1f24">Kit setup → ~/.local/bin (user 1000)</text>
  <text x="60" y="230" font-size="12" font-family="monospace" fill="#24292f">kubectl  v1.31.4</text>
  <text x="60" y="252" font-size="12" font-family="monospace" fill="#24292f">k3d  → shim   (real: k3d.bin)</text>
  <text x="60" y="274" font-size="12" font-family="monospace" fill="#24292f">helm 3 · poetry · uv</text>
  <text x="60" y="296" font-size="12" font-family="monospace" fill="#24292f">python3.12  (base ships 3.14)</text>

  <rect x="60" y="312" width="288" height="164" rx="8" fill="#fff4e5" stroke="#e0993a"/>
  <text x="74" y="334" font-size="12.5" font-weight="700" fill="#a85b00">k3d shim patches cluster-create</text>
  <text x="74" y="356" font-size="11.5" fill="#6a4a10">• /dev/kmsg  (sudo mknod + bind-mount)</text>
  <text x="74" y="378" font-size="11.5" fill="#6a4a10">• flannel  --flannel-backend=host-gw</text>
  <text x="74" y="400" font-size="11.5" fill="#6a4a10">• kubeconfig  0.0.0.0 → 127.0.0.1</text>
  <text x="74" y="428" font-size="11.5" font-weight="700" fill="#a85b00">→ ma sandbox create runs unmodified</text>
  <text x="74" y="450" font-size="11" fill="#6a4a10">every other k3d command passes through</text>

  <text x="60" y="502" font-size="12" font-weight="700" fill="#22753a">credential-free · runs fully local</text>
  <text x="60" y="524" font-size="11" fill="#57606a">no cloud keys; nothing leaves the VM</text>
  <text x="60" y="546" font-size="11" fill="#57606a">except governed image / package pulls</text>

  <!-- RIGHT: private docker daemon -->
  <rect x="384" y="180" width="736" height="344" rx="10" fill="#f7fbff" stroke="#7fb0e0"/>
  <text x="404" y="204" font-size="13" font-weight="700" fill="#0b4a8f">private Docker daemon (dockerd 29.x)</text>

  <rect x="404" y="216" width="696" height="268" rx="10" fill="#ffffff" stroke="#adc3d6"/>
  <text x="420" y="240" font-size="13" font-weight="700" fill="#1b1f24">k3d cluster (k3s v1.30) — flannel host-gw</text>

  <!-- server node -->
  <rect x="420" y="252" width="340" height="220" rx="8" fill="#eef6ff" stroke="#7aa7d6"/>
  <text x="434" y="274" font-size="12" font-weight="700" fill="#0b4a8f">server node · control-plane</text>
  <rect x="434" y="284" width="312" height="28" rx="5" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="446" y="302" font-size="11.5" fill="#24292f">API server — gRPC :15566</text>
  <rect x="434" y="320" width="312" height="28" rx="5" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="446" y="338" font-size="11.5" fill="#24292f">Dashboard UI — :8090</text>
  <rect x="434" y="356" width="312" height="28" rx="5" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="446" y="374" font-size="11.5" fill="#24292f">Workflow engine — Cadence / Temporal</text>
  <rect x="434" y="392" width="312" height="28" rx="5" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="446" y="410" font-size="11.5" fill="#24292f">MinIO — object storage</text>
  <text x="434" y="442" font-size="11" fill="#57606a">ClusterIP + NodePort routing verified ✓</text>

  <!-- agent node -->
  <rect x="772" y="252" width="316" height="220" rx="8" fill="#eef6ff" stroke="#7aa7d6"/>
  <text x="786" y="274" font-size="12" font-weight="700" fill="#0b4a8f">agent node · compute</text>
  <rect x="786" y="284" width="288" height="28" rx="5" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="798" y="302" font-size="11.5" fill="#24292f">KubeRay operator</text>
  <rect x="786" y="320" width="288" height="28" rx="5" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="798" y="338" font-size="11.5" fill="#24292f">Ray head + workers</text>
  <rect x="786" y="356" width="288" height="28" rx="5" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="798" y="374" font-size="11.5" fill="#24292f">locally-built KubeRay images</text>
  <text x="786" y="410" font-size="11" fill="#57606a">images pulled on demand from</text>
  <text x="786" y="428" font-size="11" fill="#57606a">Docker Hub · GHCR · Quay</text>

  <text x="420" y="500" font-size="11.5" fill="#57606a">Michelangelo binds services to 127.0.0.1 (loopback) → k3d maps host ports @agent:0</text>

  <!-- sbx proxy egress strip -->
  <rect x="384" y="540" width="736" height="60" rx="10" fill="#eef7ee" stroke="#4a9e59"/>
  <text x="404" y="562" font-size="12.5" font-weight="700" fill="#22753a">sbx network policy — default-deny egress allowlist</text>
  <text x="404" y="584" font-size="11" fill="#2f6b3f">toolchain: dl.k8s.io · get.helm.sh · pypi.org · github.com    ·    images: registry-1.docker.io · ghcr.io · quay.io</text>

  <!-- ===================== EGRESS CLOUD ===================== -->
  <rect x="384" y="648" width="736" height="88" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="404" y="672" font-size="13" font-weight="700" fill="#1b1f24">Internet — reached through the host, governed by the sbx proxy</text>
  <rect x="404" y="686" width="104" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="456" y="705" font-size="11" fill="#24292f" text-anchor="middle">Docker Hub</text>
  <rect x="518" y="686" width="80" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="558" y="705" font-size="11" fill="#24292f" text-anchor="middle">GHCR</text>
  <rect x="608" y="686" width="80" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="648" y="705" font-size="11" fill="#24292f" text-anchor="middle">Quay</text>
  <rect x="698" y="686" width="80" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="738" y="705" font-size="11" fill="#24292f" text-anchor="middle">PyPI</text>
  <rect x="788" y="686" width="88" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="832" y="705" font-size="11" fill="#24292f" text-anchor="middle">GitHub</text>
  <rect x="886" y="686" width="104" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="938" y="705" font-size="11" fill="#24292f" text-anchor="middle">dl.k8s.io</text>

  <!-- egress arrow: proxy -> cloud (crosses microVM border) -->
  <line x1="752" y1="600" x2="752" y2="646" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="762" y="626" font-size="10.5" fill="#57606a">governed egress</text>

  <!-- ===================== PORT-PUBLISH FLOW (VM -> host) ===================== -->
  <polyline points="1100,300 1160,300 1160,50 858,50" fill="none" stroke="#0b6bcb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowB)"/>
  <text x="1150" y="185" font-size="11" font-weight="700" fill="#0b4a8f" transform="rotate(90 1150 185)" text-anchor="middle">sbx ports publish → :8090 · :15566</text>
</svg>
