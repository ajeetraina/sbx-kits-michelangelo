<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#2f6be0"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a3d7a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1500" height="700" fill="#ffffff"/>

  <!-- HOST SYSTEM -->
  <rect x="30" y="40" width="1290" height="620" rx="28" fill="#eaf3fd" stroke="#9cc3f0" stroke-width="2"/>
  <text x="66" y="634" font-size="22" font-weight="700" fill="#1a56db">Host system — macOS + Docker Desktop</text>

  <!-- Docker Desktop (left) → k3d → Michelangelo -->
  <rect x="70" y="130" width="480" height="410" rx="22" fill="#f6faff" stroke="#c2d9f5" stroke-width="1.5"/>
  <text x="98" y="164" font-size="17" font-weight="600" fill="#16305c">Docker Desktop</text>

  <rect x="98" y="196" width="424" height="316" rx="16" fill="#ffffff" stroke="#d3e3f8" filter="url(#sh)"/>
  <text x="120" y="224" font-size="15" font-weight="600" fill="#16305c">k3d Kubernetes cluster</text>

  <rect x="120" y="242" width="380" height="250" rx="14" fill="#eef4fc" stroke="#dce8f8"/>
  <text x="310" y="272" font-size="16" font-weight="700" fill="#16305c" text-anchor="middle">Michelangelo platform</text>
  <rect x="142" y="292" width="336" height="42" rx="8" fill="#ffffff" stroke="#dce8f8"/>
  <text x="160" y="319" font-size="12.5" fill="#16305c">apiserver :15566 (gRPC) · UI :8090</text>
  <rect x="142" y="342" width="336" height="42" rx="8" fill="#ffffff" stroke="#dce8f8"/>
  <text x="160" y="369" font-size="12.5" fill="#16305c">Cadence / Temporal · MinIO</text>
  <rect x="142" y="392" width="336" height="42" rx="8" fill="#ffffff" stroke="#dce8f8"/>
  <text x="160" y="419" font-size="12.5" fill="#16305c">KubeRay operator · Ray head + workers</text>
  <text x="142" y="468" font-size="11" fill="#5a6b85">runs on Docker Desktop's Kubernetes</text>

  <!-- Workspace -->
  <rect x="600" y="110" width="220" height="64" rx="12" fill="#ffffff" stroke="#d3e3f8" filter="url(#sh)"/>
  <text x="710" y="140" font-size="15" font-weight="600" fill="#16305c" text-anchor="middle">Workspace</text>
  <text x="710" y="160" font-size="11.5" fill="#5a6b85" text-anchor="middle">agent code (mounted)</text>

  <!-- sbx microVM sandbox (middle) -->
  <rect x="600" y="206" width="340" height="330" rx="22" fill="#f6faff" stroke="#c2d9f5" stroke-width="1.5"/>
  <text x="628" y="242" font-size="17" font-weight="600" fill="#16305c">sbx microVM sandbox</text>
  <text x="628" y="262" font-size="11.5" fill="#5a6b85">holds only the agent + client</text>

  <rect x="624" y="286" width="292" height="58" rx="12" fill="#ffffff" stroke="#d3e3f8" filter="url(#sh)"/>
  <text x="770" y="322" font-size="16" font-weight="600" fill="#16305c" text-anchor="middle">Agent / Claude</text>

  <rect x="624" y="368" width="292" height="74" rx="12" fill="#ffffff" stroke="#d3e3f8" filter="url(#sh)"/>
  <text x="770" y="399" font-size="15" font-weight="600" fill="#16305c" text-anchor="middle">michelangelo-client</text>
  <text x="770" y="421" font-size="12.5" fill="#2f6be0" text-anchor="middle">ma SDK / CLI</text>

  <!-- Network policy / sbx proxy (right, inside host) -->
  <rect x="1000" y="300" width="150" height="104" rx="14" fill="#ffffff" stroke="#b8d4f5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1075" y="336" font-size="14" font-weight="600" fill="#16305c" text-anchor="middle">Network policy</text>
  <text x="1075" y="357" font-size="11.5" fill="#5a6b85" text-anchor="middle">sbx proxy</text>
  <text x="1075" y="374" font-size="11.5" fill="#5a6b85" text-anchor="middle">default-deny allowlist</text>

  <!-- External Systems (outside host) -->
  <rect x="1360" y="300" width="120" height="104" rx="16" fill="#ffffff" stroke="#cfe0f6" filter="url(#sh)"/>
  <text x="1420" y="342" font-size="14" font-weight="600" fill="#16305c" text-anchor="middle">External</text>
  <text x="1420" y="360" font-size="14" font-weight="600" fill="#16305c" text-anchor="middle">Systems</text>
  <text x="1420" y="382" font-size="10.5" fill="#5a6b85" text-anchor="middle">PyPI · registries</text>

  <!-- ARROWS -->
  <!-- workspace -> agent -->
  <line x1="710" y1="176" x2="740" y2="284" stroke="#2f6be0" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- client -> Michelangelo apiserver (gRPC) -->
  <line x1="622" y1="400" x2="502" y2="316" stroke="#2f6be0" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="512" y="360" font-size="12" font-weight="600" fill="#2f6be0">gRPC :15566</text>
  <!-- client -> network policy -> external (governed egress, e.g. pip install) -->
  <line x1="918" y1="402" x2="998" y2="356" stroke="#2f6be0" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1150" y1="352" x2="1358" y2="352" stroke="#2f6be0" stroke-width="2.5" stroke-dasharray="3 5" marker-end="url(#a)"/>
  <text x="1180" y="342" font-size="11" fill="#2f6be0">install</text>
</svg>
