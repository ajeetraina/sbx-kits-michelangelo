schemaVersion: "2"
kind: mixin
name: michelangelo
displayName: Michelangelo (client)
description: >-
  Installs the `michelangelo` SDK/CLI (the `ma` client) into an agent sandbox and
  wires it to a Michelangelo ML platform running OUTSIDE the microVM (on your
  host's Docker Desktop, or a remote cluster). Credential-free and lightweight:
  the platform runs elsewhere, the sandbox holds only the client. Mirrors the
  Grafana / Ollama "sandbox the agent, talk to a host service" pattern.
permissions:
  network:
    allow:
      - pypi.org                       # pip install michelangelo (SDK/CLI + gRPC deps)
      - files.pythonhosted.org
      # The client talks to a Michelangelo running outside the sandbox. Point
      # MACTL_ADDRESS at a routable backend the sbx proxy can reach, and allow
      # that host:port here. host.docker.internal reaches the host (see README).
      - host.docker.internal:15566     # ma-apiserver (gRPC)
      - host.docker.internal:9091      # MinIO object store
environment:
  variables:
    # Read by michelangelo/cli/mactl/config.py as env overrides (no config file).
    # Override MACTL_ADDRESS / AWS_ENDPOINT_URL to point at your Michelangelo.
    MACTL_ADDRESS: "host.docker.internal:15566"
    MACTL_USE_TLS: "false"            # OSS apiserver speaks plaintext gRPC
    AWS_ENDPOINT_URL: "http://host.docker.internal:9091"
    AWS_ACCESS_KEY_ID: "minioadmin"  # local Michelangelo default creds
    AWS_SECRET_ACCESS_KEY: "minioadmin"
    NO_PROXY: "localhost,127.0.0.1,host.docker.internal"
    no_proxy: "localhost,127.0.0.1,host.docker.internal"
setup:
  install:
    - command: "pip install --break-system-packages --user michelangelo"
      user: "1000"
      description: "Install the Michelangelo Python SDK/CLI (the `ma` client) into ~/.local/bin"
agentInstructions:
  content: |
    ## Michelangelo client (the platform runs outside this sandbox)

    This kit installs only the client (`ma` CLI + the `michelangelo` Python SDK),
    wired to a Michelangelo running on your host or a remote cluster:
      - apiserver (gRPC): $MACTL_ADDRESS
      - object store:     $AWS_ENDPOINT_URL

    Use the `ma` client to talk to the already-running platform. Do NOT run
    `ma sandbox create` here: the cluster lives outside this microVM.

    If client calls fail with UNAVAILABLE / "connections to all backends failing",
    the backend is not reachable. Point MACTL_ADDRESS at a routable host:port the
    sbx proxy can forward to (a same-host loopback backend is not routable). See
    the kit README.
