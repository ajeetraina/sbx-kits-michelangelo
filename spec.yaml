schemaVersion: "2"
kind: mixin
name: michelangelo
displayName: Michelangelo (Uber ML platform sandbox)
description: "Turns any sandbox into a one-command dev environment for Uber's Michelangelo ML platform. Installs the local-cluster toolchain (kubectl + k3d + Helm + Poetry) so `ma sandbox create` stands up the full platform — API server, workflow engine (Cadence/Temporal), object storage, KubeRay — on the sandbox's OWN private Docker daemon. The microVM replaces Colima: no host Docker, no nested VM. Credential-free; the platform runs entirely locally."

# The Michelangelo sandbox needs a Linux host with a Docker daemon to run its
# k3d cluster. On a laptop that host is normally Colima; inside a Docker
# Sandbox the microVM already IS that host (its own kernel + private Docker
# daemon, same property the Dagger kit relies on), so k3d runs natively and the
# host stays untouched behind the hypervisor boundary.

permissions:
  network:
    allow:
      # --- Toolchain installers (run once at kit setup) ---
      - dl.k8s.io                          # kubectl binary (served directly, 200)
      - raw.githubusercontent.com          # k3d install.sh + helm get-helm-3
      - get.helm.sh                        # helm release archives
      # --- Cloning the platform repo + Python deps (run inside the sandbox) ---
      - github.com                         # git clone michelangelo + release redirects
      - codeload.github.com                # github archive/clone transport
      - objects.githubusercontent.com      # github release binaries (k3d/helm)
      - release-assets.githubusercontent.com  # github release binaries (k3d)
      - pypi.org                           # poetry (pip install) + `poetry install` deps
      - files.pythonhosted.org
      # --- Cluster image pulls during `ma sandbox create` ---
      # k3s, KubeRay, workflow-engine, and object-store images. This is a
      # best-effort starting set covering the common registries; if a pull is
      # blocked, `sbx policy log` names the host to add here (see README §Network).
      - registry-1.docker.io               # Docker Hub (rancher/k3s, rayproject/ray, minio, ...)
      - auth.docker.io
      - production.cloudflare.docker.com   # Docker Hub blob CDN
      - ghcr.io                            # some operator/engine images
      - pkg-containers.githubusercontent.com  # ghcr.io blob storage
      - quay.io                            # kuberay operator + assorted k8s images
      - cdn.quay.io
      - cdn01.quay.io
      - cdn02.quay.io
      - cdn03.quay.io
      # --- apt INSIDE the KubeRay image build (scripts/kuberay/build-kuberay-images.sh) ---
      # The build's ubuntu:22.04 stage runs apt-get; the sbx proxy governs
      # build-container egress too, so these mirrors must be reachable.
      - ports.ubuntu.com                   # arm64 apt packages
      - archive.ubuntu.com                 # amd64 apt packages
      - security.ubuntu.com                # apt security updates
      # --- Go module proxy INSIDE the KubeRay image build ---
      # The KubeRay Dockerfiles compile Go (`RUN go mod download`); without these
      # the build fails at "lookup proxy.golang.org ... no such host".
      - proxy.golang.org                   # Go module proxy (GOPROXY default)
      - sum.golang.org                     # Go checksum database (GOSUMDB default)
      # --- Helm chart repos + MinIO client, added during `ma sandbox create` ---
      # `_helm_ensure_repos()` adds the Cadence + Temporal engine repos and the
      # spark-operator / KubeRay / istio repos; the MinIO setup job pulls `mc`.
      - cadence-workflow.github.io            # Cadence engine helm charts (default engine)
      - go.temporal.io                        # Temporal engine helm charts
      - kubeflow.github.io                    # spark-operator helm charts
      - ray-project.github.io                 # KubeRay helm charts
      - istio-release.storage.googleapis.com  # istio helm charts
      - dl.min.io                             # MinIO `mc` client / server download

setup:
  install:
    - command: "mkdir -p \"$HOME/.local/bin\" && arch=\"$(uname -m)\"; case \"$arch\" in x86_64) arch=amd64;; aarch64|arm64) arch=arm64;; esac; curl -fsSLo \"$HOME/.local/bin/kubectl\" \"https://dl.k8s.io/release/v1.31.4/bin/linux/${arch}/kubectl\" && chmod +x \"$HOME/.local/bin/kubectl\""
      user: "1000"
      description: "Install kubectl v1.31.4 into ~/.local/bin (arch-aware: amd64/arm64, non-root)"
    - command: "curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.7.4 USE_SUDO=false K3D_INSTALL_DIR=\"$HOME/.local/bin\" bash"
      user: "1000"
      description: "Install k3d v5.7.4 into ~/.local/bin (non-root)"
    - command: "echo '' | base64 -d > \"$HOME/.local/bin/k3d.wrap\" && mv -f \"$HOME/.local/bin/k3d\" \"$HOME/.local/bin/k3d.bin\" && mv -f \"$HOME/.local/bin/k3d.wrap\" \"$HOME/.local/bin/k3d\" && chmod +x \"$HOME/.local/bin/k3d\" \"$HOME/.local/bin/k3d.bin\""
      user: "1000"
      description: "Wrap k3d in a shim that patches cluster-create for the microVM kernel (adds /dev/kmsg, flannel host-gw, 127.0.0.1 API endpoint) so `ma sandbox create` works unmodified"
    - command: "curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | HELM_INSTALL_DIR=\"$HOME/.local/bin\" USE_SUDO=false bash"
      user: "1000"
      description: "Install the latest Helm 3 into ~/.local/bin (non-root)"
    - command: "pip install --user --break-system-packages poetry uv"
      user: "1000"
      description: "Install Poetry + uv from PyPI (Poetry builds the `ma` CLI; uv provisions Python)"
    - command: "uv python install 3.12 && ln -sf \"$(uv python find 3.12)\" \"$HOME/.local/bin/python3.12\""
      user: "1000"
      description: "Provision a prebuilt CPython 3.12 (base image ships 3.14, which Michelangelo's deps predate) and expose it as python3.12"
    - command: "echo '' | base64 -d > \"$HOME/.local/bin/michelangelo-up\" && chmod +x \"$HOME/.local/bin/michelangelo-up\" && for f in \"$HOME/.profile\" \"$HOME/.bashrc\"; do grep -qsF .local/bin \"$f\" 2>/dev/null || echo 'export PATH=\"$HOME/.local/bin:$PATH\"' >> \"$f\"; done"
      user: "1000"
      description: "Install the `michelangelo-up` one-command bring-up helper and persist ~/.local/bin on PATH (so the manual `export PATH` steps are no longer needed)"

agentInstructions:
  content: |
    This sandbox is preloaded to run Uber's Michelangelo ML platform locally.
    The cluster toolchain — `kubectl`, `k3d`, `helm`, `poetry`, `uv` — is
    installed in `~/.local/bin`, which the kit has already added to your PATH
    (persisted in ~/.profile and ~/.bashrc), so no `export` is needed.

    Fastest path — the kit ships a one-command helper that does the whole
    upstream flow (clone → build `ma` → build KubeRay images → `ma sandbox
    create`) and is re-runnable:

        michelangelo-up            # bring the platform up (Cadence default)
        michelangelo-up --demo     # …and run the demo pipeline smoke test

    Extra args pass through to `ma sandbox create` (e.g. `michelangelo-up
    --workflow temporal`). The manual equivalent is spelled out at the bottom of
    this note if you need to run a step by hand.

    Key fact: this microVM has its OWN private Docker daemon, so k3d runs a real
    Kubernetes cluster right here. Colima is NOT needed and NOT installed — the
    Michelangelo docs use Colima only to give a laptop a Linux+Docker host, and
    the sandbox already is one. Everything runs inside the VM; the host is never
    touched.

    Key fact: `k3d` here is a thin SHIM (the real binary is `k3d.bin`). The
    microVM kernel differs from a normal Linux host in three ways that would
    otherwise break `k3d cluster create` — no `/dev/kmsg` (kubelet aborts), no
    VXLAN (flannel's default backend fails), and the API advertised on 0.0.0.0
    (unroutable as a destination here, so host kubectl/helm get "unexpected
    EOF"). The shim patches all three automatically on every `cluster create`
    (creates /dev/kmsg via `sudo mknod`, forces `--flannel-backend=host-gw`, and
    rewrites the kubeconfig endpoint to 127.0.0.1). So `ma sandbox create` works
    unmodified — you do NOT need to pass any k3d flags yourself. (This relies on
    passwordless `sudo` for the one-time `mknod`; it is available in the sandbox.)

    IMPORTANT — Python version: the base image ships Python 3.14, but Michelangelo
    requires 3.11/3.12 (its pinned deps like numpy have no 3.14 wheels and there
    is no compiler here). A prebuilt CPython 3.12 is provisioned via `uv` and
    exposed as `python3.12` — point Poetry at it before installing, or the build
    fails trying to compile numpy.

    The `ma` CLI is not a standalone binary — it is produced by `poetry install`
    inside the michelangelo repo. `michelangelo-up` runs exactly these steps; run
    them by hand only if you need to drive one in isolation:

        git clone https://github.com/michelangelo-ai/michelangelo.git
        cd michelangelo
        (cd python && poetry env use python3.12 && poetry install)   # 3.12 venv + `ma` CLI
        export PATH="$PWD/python/.venv/bin:$PATH"       # put `ma` on PATH (or use `poetry run`)
        bash scripts/kuberay/build-kuberay-images.sh   # build local KubeRay images
        ma sandbox create                      # 30-60 min first run; pulls cluster images
        ma sandbox demo pipeline               # smoke test

    After the build, the `ma` CLI lives at ~/michelangelo/python/.venv/bin/ma.

    Use Temporal instead of the default Cadence engine with:
        ma sandbox create --workflow temporal

    Lifecycle: `ma sandbox sync` (redeploy), `ma sandbox stop|start`, `ma sandbox delete`.

    Reaching the web UIs from your host (services inside bind 0.0.0.0):
      - Dashboard: sandbox :8090   - gRPC API: sandbox :15566
    Publish them after the cluster is up, from the HOST shell:
        sbx ports <sandbox-name> --publish 8090:8090 --publish 15566:15566
    then open http://localhost:8090.

    Resources: `ma sandbox create` wants ~4 vCPU / 8 GB RAM / 60 GB disk. If the
    cluster is OOM-killed or fails to schedule, the sandbox was started too
    small — recreate it with a larger `-m` (see README).

    If an image pull fails during `ma sandbox create`, it is almost always this
    kit's network allowlist. Run `sbx policy log` on the host to see the blocked
    host, then add it to `permissions.network.allow` in the kit's spec.yaml.
